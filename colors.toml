[meta]
name = "Gruvbox Material"
variant = "dark-medium + adaptive-browser"
reference = "nvim gruvbox-material + Chromium User Color"

# Compatibility table: all existing generated desktop surfaces still read
# [colors], so they stay pinned to Gruvbox Material Dark Medium.
[colors]
bg_hard = "#1d2021"
bg = "#282828"
bg_alt = "#32302f"
bg_soft = "#3c3836"
bg_hover = "#504945"
bg_muted = "#665c54"
fg = "#d4be98"
fg_ui = "#ebdbb2"
fg_bright = "#fbf1c7"
fg_soft = "#d5c4a1"
gray = "#928374"
gray_dim = "#a89984"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
orange = "#e78a4e"
blue = "#7daea3"
purple = "#d3869b"
aqua = "#89b482"
legacy_blue = "#83a598"
legacy_green = "#b8bb26"
legacy_orange = "#fe8019"
legacy_aqua = "#8ec07c"
legacy_red = "#fb4934"
legacy_yellow = "#fabd2f"
legacy_blue_dark = "#458588"
legacy_green_dark = "#689d6a"
diff_added = "#3c4a30"
diff_removed = "#4c3432"
diff_added_dimmed = "#333a2a"
diff_removed_dimmed = "#3f2e2c"

# Reference daylight palette. Chromium's built-in adaptive User Color theme does
# not consume these exact values; it generates its own light/dark Material
# palettes from [helium]. This remains the visual target for white-page harmony.
[colors_light]
bg_hard = "#f2efe8"
bg = "#fbfaf7"
bg_alt = "#f4f2ed"
bg_soft = "#ece9e2"
bg_hover = "#e3dfd5"
bg_muted = "#d5cfc3"
fg = "#3c3836"
fg_ui = "#282828"
fg_bright = "#1d2021"
fg_soft = "#665c54"
gray = "#928374"
gray_dim = "#7c746b"
red = "#c14a4a"
green = "#6c782e"
yellow = "#b47109"
orange = "#c35e0a"
blue = "#45707a"
purple = "#945e80"
aqua = "#4c7a5d"
legacy_blue = "#076678"
legacy_green = "#79740e"
legacy_orange = "#af3a03"
legacy_aqua = "#427b58"
legacy_red = "#9d0006"
legacy_yellow = "#b57614"
legacy_blue_dark = "#458588"
legacy_green_dark = "#689d6a"
diff_added = "#e7eedc"
diff_removed = "#f2dfdc"
diff_added_dimmed = "#eef2e8"
diff_removed_dimmed = "#f5e9e7"

# Helium uses Chromium's native User Color theme rather than an extension theme.
# Neutral keeps large surfaces near white/charcoal while this warm Gruvbox seed
# provides the accent. System color scheme follows darkman's XDG portal signal
# live, without rebuilding a theme or restarting Helium.
[helium]
user_color = "#b47109"
color_variant = "neutral"
color_scheme = "system"
