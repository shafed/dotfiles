# Compact quick-access panel for the external Neovim textarea bridge.
# It is a layer-shell surface, not a normal kitty OS window, so Hyprland's
# `kitty -> workspace 1` rule does not move the user away from the source app.
edge center-sized
lines 12
columns 90
layer overlay
focus_policy exclusive
hide_on_focus_loss no
background_opacity 0.96
app_id nvim-textarea
kitty_override tab_bar_style=hidden
kitty_override window_padding_width=8
