[profile]
description = "CLI, editor and shared dotfiles used on every machine"
includes = []
capabilities = ["base"]
config_dirs = ["kitty", "nvim", "yazi", "lazygit", "sioyek"]
sources = ["scripts/sudo-notify.sh"]

[[links]]
source = "xdg/mimeapps.list"
destination = "{config}/mimeapps.list"
reason = "default application associations"

[[links]]
source = "zsh/zshrc"
destination = "{home}/.zshrc"
reason = "shared interactive shell configuration"

[[links]]
source = "zsh/zprofile"
destination = "{home}/.zprofile"
reason = "shared login shell configuration"

[[links]]
source = "instructions.md"
destination = "{home}/.claude/CLAUDE.md"
reason = "shared agent instructions"

[[links]]
source = "instructions.md"
destination = "{config}/opencode/AGENTS.md"
reason = "shared agent instructions"

[[links]]
source = "instructions.md"
destination = "{home}/.codex/AGENTS.md"
reason = "shared agent instructions"

[[links]]
source = ".claude/hooks/no-coauthor.sh"
destination = "{home}/.claude/hooks/no-coauthor.sh"
reason = "shared Claude hook"

[[links]]
source = ".claude/themes/gruvbox-material.json"
destination = "{home}/.claude/themes/gruvbox-material.json"
reason = "shared Claude theme"

[[links]]
source = "dots"
destination = "{home}/.local/bin/dots"
reason = "install the dotfiles CLI"

[[files]]
destination = "{home}/.local/bin/sudo"
mode = "0755"
reason = "notify after sudo completes"
content = '''#!/usr/bin/env bash
exec "{root}/scripts/sudo-notify.sh" "$@"
'''

[[files]]
destination = "{home}/.local/bin/sioyek"
mode = "0755"
reason = "start Sioyek with the repository's known-good environment"
content = '''#!/usr/bin/env bash
exec env -u LIBGL_ALWAYS_SOFTWARE QT_QPA_PLATFORM=xcb /usr/bin/sioyek "$@"
'''

