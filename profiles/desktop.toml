[profile]
description = "Hyprland desktop session and graphical integrations"
includes = ["base"]
capabilities = ["desktop", "bluetooth"]
config_dirs = ["hypr", "kanata", "quickshell", "darkman", "systemd"]
sources = ["helium/apply-gruvbox-theme.py", "scripts/dots-helium-generator.sh", "scripts/copyq-apply-theme.py", "scripts/dots-telegram-generator.sh", "telegram/generate-theme.py", "telegram/_palette_renderer.py", "telegram/background.png.b64"]
services = ["quickshell.service", "kanata.service", "darkman.service", "copyq.service"]

[[links]]
source = "darkman/scripts"
destination = "{data}/darkman"
reason = "darkman hooks generated from the tracked theme"

[[generators]]
name = "helium-theme"
apply = ["bash", "scripts/dots-helium-generator.sh"]
outputs = ["{data}/dotfiles/helium-gruvbox/manifest.json", "{config}/helium-browser-flags.conf"]
reason = "keep Helium's generated Gruvbox extension and flags in sync"

[[generators]]
name = "copyq-live-config"
apply = ["python3", "scripts/copyq-apply-theme.py"]
outputs = ["{config}/copyq/copyq.conf"]
reason = "merge the generated theme into CopyQ's mutable live config"

[[generators]]
name = "telegram-live-theme"
apply = ["bash", "scripts/dots-telegram-generator.sh", "auto"]
outputs = ["{data}/dotfiles/telegram/current.tdesktop-theme"]
reason = "keep one stable Telegram theme inode that darkman can rewrite without dropping Telegram's watcher"

[[prerequisites]]
kind = "system-service"
name = "NetworkManager.service"
required = true
reason = "network controls and status need NetworkManager"

[[prerequisites]]
kind = "system-service"
name = "bluetooth.service"
required = true
reason = "Bluetooth capability needs the BlueZ daemon"

[[packages]]
command = "hyprland"
package = "hyprland"
manager = "pacman"
required = true
reason = "desktop compositor"

[[packages]]
command = "uwsm"
package = "uwsm"
manager = "pacman"
required = true
reason = "starts and manages the Hyprland session"

[[packages]]
command = "hypridle"
package = "hypridle"
manager = "pacman"
required = true
reason = "idle daemon started by hypr/modules/autostart.lua"

[[packages]]
command = "hyprlock"
package = "hyprlock"
manager = "pacman"
required = true
reason = "screen locker used by hypridle.conf and the SUPER+Home bind"

[[packages]]
command = "hyprpaper"
package = "hyprpaper"
manager = "pacman"
required = true
reason = "wallpaper daemon started by autostart and driven by darkman's wallpaper hook"

[[packages]]
command = "hyprpicker"
package = "hyprpicker"
manager = "pacman"
required = true
reason = "cursor freeze used by kanata screenshot-region.sh"

[[packages]]
command = "hyprland-per-window-layout"
package = "hyprland-per-window-layout"
manager = "aur"
required = true
reason = "per-window keyboard layout daemon started by autostart.lua"

[[packages]]
command = "kanata"
package = "kanata-bin"
manager = "aur"
required = true
reason = "keyboard layers and chords"

[[packages]]
command = "helium-browser"
package = "helium-browser-bin"
manager = "aur"
required = true
reason = "browser configuration and generated theme"

[[packages]]
command = "quickshell"
package = "quickshell"
manager = "pacman"
required = true
reason = "top bar, panels and desktop shell"

[[packages]]
command = "wpctl"
package = "wireplumber"
manager = "pacman"
required = true
reason = "audio controls used by Quickshell and keybindings"

[[packages]]
command = "nmcli"
package = "networkmanager"
manager = "pacman"
required = true
reason = "network status and controls"

[[packages]]
command = "bluetoothctl"
package = "bluez-utils"
manager = "pacman"
required = true
reason = "Bluetooth capability"

[[packages]]
command = "checkupdates"
package = "pacman-contrib"
manager = "pacman"
required = true
reason = "update count in Quickshell"

[[packages]]
command = "wl-paste"
package = "wl-clipboard"
manager = "pacman"
required = true
reason = "Wayland clipboard integration"

[[packages]]
command = "copyq"
package = "copyq"
manager = "pacman"
required = true
reason = "clipboard history backend"

[[packages]]
command = "darkman"
package = "darkman"
manager = "aur"
required = true
reason = "theme switching service"

[[packages]]
command = "rofimoji"
package = "rofimoji"
manager = "pacman"
required = true
reason = "emoji picker bound in kanata/config.kbd"
