[profile]
description = "Hyprland desktop session and graphical integrations"
includes = ["base"]
capabilities = ["desktop"]
config_dirs = ["hypr", "kanata", "quickshell", "darkman", "systemd"]
sources = ["helium/apply-gruvbox-theme.py", "helium/switch-gruvbox-theme.py", "helium/gruvbox-dark/manifest.json", "helium/gruvbox-light/manifest.json", "scripts/dots-helium-generator.sh", "scripts/copyq-apply-theme.py", "scripts/dots-telegram-generator.sh", "telegram/generate-theme.py", "telegram/_palette_renderer.py", "telegram/background.png"]
services = ["quickshell.service", "kanata.service", "darkman.service", "copyq.service", "google-calendar-sync.timer"]

[[links]]
source = "darkman/scripts"
destination = "{data}/darkman"
reason = "darkman hooks generated from the tracked theme"

[[links]]
source = "vdirsyncer/config"
destination = "{config}/vdirsyncer/config"
reason = "Google Calendar CalDAV sync configuration; OAuth secrets remain local and untracked"

[[links]]
source = "khal/config"
destination = "{config}/khal/config"
reason = "read synchronized calendar vdirs for the Quickshell calendar service"

[[generators]]
name = "helium-theme"
apply = ["bash", "scripts/dots-helium-generator.sh"]
outputs = ["{config}/helium-browser-flags.conf", "{data}/dotfiles/helium-gruvbox"]
reason = "load the exact Gruvbox extension theme and let darkman reload its light/dark manifest live"

[[generators]]
name = "copyq-live-config"
apply = ["python3", "scripts/copyq-apply-theme.py"]
outputs = ["{config}/copyq/copyq.conf"]
reason = "merge the generated theme into CopyQ's mutable live config"

[[generators]]
name = "telegram-live-theme"
apply = ["bash", "scripts/dots-telegram-generator.sh", "auto"]
outputs = ["{data}/dotfiles/telegram/current.tdesktop-theme"]
reason = "keep one stable Telegram theme inode that darkman can rewrite without dropping Telegram's watcher"

[[prerequisites]]
kind = "system-service"
name = "NetworkManager.service"
required = true
reason = "network controls and status need NetworkManager"

[[packages]]
command = "hyprland"
package = "hyprland"
manager = "pacman"
required = true
reason = "desktop compositor"

[[packages]]
command = "uwsm"
package = "uwsm"
manager = "pacman"
required = true
reason = "starts and manages the Hyprland session"

