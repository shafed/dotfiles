[profile]
description = "Desktop profile plus laptop-only power, brightness and Bluetooth controls"
includes = ["desktop", "bluetooth"]
capabilities = ["laptop", "battery"]

[[prerequisites]]
kind = "system-service"
name = "power-profiles-daemon.service"
required = true
reason = "laptop power profile controls need the system daemon"

[[packages]]
command = "powerprofilesctl"
package = "power-profiles-daemon"
manager = "pacman"
required = true
reason = "laptop power profile capability"

[[packages]]
command = "brightnessctl"
package = "brightnessctl"
manager = "pacman"
required = true
reason = "laptop display brightness controls"
