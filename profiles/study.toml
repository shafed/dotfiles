[profile]
description = "Coursework tooling that the editor setup expects"
includes = ["base"]
capabilities = ["study"]

[[packages]]
command = "scilab"
package = "scilab-bin"
manager = "aur"
required = true
reason = "run and send code to Scilab for the modelling-packages course"

[[packages]]
command = "jupytext"
package = "jupytext"
manager = "uv-tool"
required = true
reason = "jupytext.nvim opens .ipynb as py:percent text and writes it back on save"

[[packages]]
command = "mvn"
package = "maven"
manager = "pacman"
required = true
reason = "build and run the Maven-based Java coursework in 21-algorithms-data-structures"
