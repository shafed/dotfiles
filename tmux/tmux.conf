set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# Sidekick CLIs run in tmux-backed kitty panes. Without tmux mouse handling,
# kitty sees tmux's alternate screen and turns wheel events into Up/Down keys,
# which the CLI interprets as command history instead of scrollback.
set -g mouse on

# Most CLIs detect 24-bit support from $COLORTERM, not from terminfo, and tmux
# does not forward it into panes on its own even with terminal-overrides RGB
# above (verified with opencode: no COLORTERM means 38;5;N codes instead of
# 38;2;r;g;b). Claude Code needs a separate override for the same underlying
# problem; see nvim/lua/plugins/sidekick.lua.
set-environment -g COLORTERM truecolor
